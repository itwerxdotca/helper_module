helper_module.city_autocomplete:
  path: '/helper-module/autocomplete/city/{province}'
  defaults:
    _controller: '\Drupal\helper_module\Controller\CityAutocompleteController::autocomplete'
    _title: 'City Autocomplete'
  requirements:
    _permission: 'access content'
    province: \d+

helper_module.province_town_taxonomy:
    path: '/{province}/{town}/{categories}'
    defaults:
      _controller: '\Drupal\helper_module\Controller\ProvinceTownTaxonomyController::render'
    requirements:
      _permission: 'access content'
      province: '[a-z0-9-]+'
      town: '[a-z0-9-]+'
      categories: '[a-zA-Z0-9/\-_]+'
    options:
      utf8: true
